name: Build Cornet Downloads

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RELEASE_REPO: NovaZephyr/cornet-downloads

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install --minimum-release-age 0

      - name: Build Windows packages
        run: bun run tauri build --bundles nsis,msi

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: cornet-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  linux:
    name: Linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: bun install --minimum-release-age 0

      - name: Build Linux packages
        run: bun run tauri build --bundles appimage,deb

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: cornet-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install dependencies
        run: bun install --minimum-release-age 0

      - name: Initialize Tauri Android project
        run: bunx tauri android init

      - name: Build Android APK
        run: bunx tauri android build --apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: cornet-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: cornet-windows
          path: release-assets/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: cornet-linux
          path: release-assets/linux

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: cornet-android
          path: release-assets/android

      - name: Publish GitHub Release to cornet-downloads
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          REPO="${RELEASE_REPO}"

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading build assets."
          else
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "Cornet $TAG" \
              --generate-notes
          fi

          mapfile -t ASSETS < <(find release-assets -type f \( \
            -name '*.exe' -o \
            -name '*.msi' -o \
            -name '*.AppImage' -o \
            -name '*.deb' -o \
            -name '*.apk' \
          \) -print)

          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "No release assets were found."
            find release-assets -type f -print || true
            exit 1
          fi

          printf 'Uploading %s release assets:\n' "${#ASSETS[@]}"
          printf ' - %s\n' "${ASSETS[@]}"

          gh release upload "$TAG" \
            --repo "$REPO" \
            --clobber \
            "${ASSETS[@]}"
